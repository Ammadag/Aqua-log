<style>

            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

            background: #bfc8cc;

<body class="bg-background text-on-background h-screen w-full flex flex-col overflow-hidden font-sans">
<!-- Top App Bar (Sub-screen/Transactional Version) -->
<!-- Navigation shell suppressed as per "Linear/Transactional" rule for sub-pages with Back actions -->
<header class="flex items-center justify-between px-margin-mobile h-[64px] w-full z-40 bg-surface border-b border-outline-variant shadow-sm transition-colors duration-200 shrink-0">
<button aria-label="Go back" class="w-touch-target h-touch-target flex items-center justify-start text-on-surface-variant hover:text-primary-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-on-surface flex-1 text-center truncate pr-touch-target">
            Select Contact
        </h1>
</header>
<!-- Search Section -->
<div class="px-margin-mobile py-base bg-surface border-b border-outline-variant shrink-0">
<div class="relative flex items-center w-full h-[48px] rounded bg-background border border-outline focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<span class="material-symbols-outlined absolute left-3 text-outline">search</span>
<input class="w-full h-full pl-10 pr-4 bg-transparent border-none outline-none text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:ring-0" placeholder="Search contacts..." type="text"/>
</div>
</div>
<!-- Contact List (Scrollable Canvas) -->
<main class="flex-1 overflow-y-auto w-full max-w-[600px] mx-auto bg-surface">
<ul class="flex flex-col">
<!-- Selected Contact Row -->
<li class="relative border-b border-outline-variant/30">
<button class="w-full flex items-center px-margin-mobile py-3 bg-surface-container-high hover:bg-surface-container-highest transition-colors text-left focus:outline-none">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary text-headline-md font-headline-md shadow-sm">
                        A
                    </div>
<div class="ml-4 flex-1 flex flex-col justify-center">
<span class="text-body-lg font-body-lg text-on-surface font-semibold">Ahmed Electronics</span>
<span class="text-body-sm font-body-sm text-on-surface-variant mt-0.5 font-mono">+92 (0300) 1234567</span>
</div>
<div class="flex-shrink-0 w-8 h-8 flex items-center justify-center text-primary-container ml-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</li>
<!-- Unselected Contact Row -->
<li class="relative border-b border-outline-variant/30">
<button class="w-full flex items-center px-margin-mobile py-3 bg-surface hover:bg-surface-container-low transition-colors text-left focus:outline-none">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant text-headline-md font-headline-md">
                        A
                    </div>
<div class="ml-4 flex-1 flex flex-col justify-center">
<span class="text-body-lg font-body-lg text-on-surface">Ali House</span>
<span class="text-body-sm font-body-sm text-on-surface-variant mt-0.5 font-mono">+92 (0312) 4567890</span>
</div>
</button>
</li>
<!-- Unselected Contact Row -->
<li class="relative border-b border-outline-variant/30">
<button class="w-full flex items-center px-margin-mobile py-3 bg-surface hover:bg-surface-container-low transition-colors text-left focus:outline-none">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant text-headline-md font-headline-md">
                        A
                    </div>
<div class="ml-4 flex-1 flex flex-col justify-center">
<span class="text-body-lg font-body-lg text-on-surface">ABC Office</span>
<span class="text-body-sm font-body-sm text-on-surface-variant mt-0.5 font-mono">+92 (0333) 7654321</span>
</div>
</button>
</li>
<!-- Unselected Contact Row -->
<li class="relative border-b border-outline-variant/30">
<button class="w-full flex items-center px-margin-mobile py-3 bg-surface hover:bg-surface-container-low transition-colors text-left focus:outline-none">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant text-headline-md font-headline-md">
                        B
                    </div>
<div class="ml-4 flex-1 flex flex-col justify-center">
<span class="text-body-lg font-body-lg text-on-surface">Bilal Traders</span>
<span class="text-body-sm font-body-sm text-on-surface-variant mt-0.5 font-mono">+92 (0345) 1234567</span>
</div>
</button>
</li>
<!-- Unselected Contact Row -->
<li class="relative">
<button class="w-full flex items-center px-margin-mobile py-3 bg-surface hover:bg-surface-container-low transition-colors text-left focus:outline-none">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant text-headline-md font-headline-md">
                        C
                    </div>
<div class="ml-4 flex-1 flex flex-col justify-center">
<span class="text-body-lg font-body-lg text-on-surface">City School</span>
<span class="text-body-sm font-body-sm text-on-surface-variant mt-0.5 font-mono">+92 (0301) 9876543</span>
</div>
</button>
</li>
<!-- Bottom padding to prevent last item hiding behind fixed button -->
<li aria-hidden="true" class="h-[100px]"></li>
</ul>
</main>
<!-- Bottom Action Area (Fixed) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface border-t border-outline-variant/50 shadow-[0_-4px_12px_rgba(0,0,0,0.03)] z-50">
<button class="w-full h-touch-target bg-primary-container hover:bg-on-primary-fixed-variant text-on-primary rounded shadow-sm transition-all flex items-center justify-center font-label-caps text-label-caps tracking-widest active:scale-[0.98]">
            CONTINUE
        </button>
</div>
