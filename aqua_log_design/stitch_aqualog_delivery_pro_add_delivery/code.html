<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AquaFlow - Add Delivery</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Design System Theme -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#0d1c2d",
                        "inverse-on-surface": "#e9f1ff",
                        "secondary-fixed": "#b0efda",
                        "secondary-fixed-dim": "#95d3be",
                        "primary": "#004655",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#002018",
                        "surface-tint": "#13677b",
                        "primary-fixed": "#b2ebff",
                        "secondary": "#2b6958",
                        "surface": "#f8f9ff",
                        "primary-fixed-dim": "#8bd1e8",
                        "tertiary-container": "#baaa7c",
                        "on-primary-fixed-variant": "#004e5f",
                        "surface-dim": "#ccdbf2",
                        "on-surface-variant": "#3f484c",
                        "primary-container": "#005f73",
                        "on-tertiary-fixed-variant": "#514620",
                        "secondary-container": "#aeedd7",
                        "background": "#f8f9ff",
                        "outline": "#6f797c",
                        "tertiary-fixed-dim": "#d6c695",
                        "error-container": "#ffdad6",
                        "surface-variant": "#d4e4fa",
                        "surface-container-high": "#dbe9ff",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#306d5c",
                        "surface-container-low": "#eef4ff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#001f27",
                        "tertiary-fixed": "#f3e2af",
                        "surface-container-highest": "#d4e4fa",
                        "on-primary-container": "#91d7ee",
                        "tertiary": "#6a5e36",
                        "on-error": "#ffffff",
                        "inverse-primary": "#8bd1e8",
                        "on-tertiary-container": "#493f1a",
                        "surface-container": "#e5efff",
                        "on-surface": "#0d1c2d",
                        "on-secondary-fixed-variant": "#0b5040",
                        "surface-bright": "#f8f9ff",
                        "outline-variant": "#bfc8cc",
                        "on-tertiary-fixed": "#231b00",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#233143"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "touch-target": "48px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "price-display": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "price-display": ["18px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant z-50">
<div class="flex justify-between items-center px-gutter h-touch-target w-full">
<button class="flex items-center justify-center w-touch-target h-touch-target rounded-full hover:bg-surface-container-low active:scale-95 duration-100 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary truncate">Add Delivery</h1>
<div class="w-touch-target h-touch-target"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile md:px-margin-desktop py-gutter gap-6 md:max-w-screen-md md:mx-auto w-full pb-32">
<!-- Customer Section -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex justify-between items-start">
<div class="flex flex-col gap-1">
<h2 class="font-body-sm text-body-sm text-on-surface-variant">Selected Customer</h2>
<div class="font-body-lg text-body-lg text-on-surface font-semibold">Ahmed Electronics</div>
<div class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="call">call</span> +92 300 1234567
                </div>
<div class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="location_on">location_on</span> Islamabad
                </div>
</div>
<button class="h-10 px-4 rounded-lg border-1.5 border-primary text-primary font-body-sm text-body-sm font-semibold hover:bg-surface-container-low transition-colors">
                Change
            </button>
</section>
<!-- Date Selector -->
<section class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">Delivery Date</label>
<div class="relative">
<select class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-4 font-body-lg text-body-lg text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
<option selected="" value="today">Today</option>
<option value="yesterday">Yesterday</option>
<option value="other">Other Date...</option>
</select>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
</div>
</div>
</section>
<!-- Delivery Inputs -->
<section class="flex flex-col gap-6">
<!-- Bottles Delivered -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 flex flex-col items-center gap-4">
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold text-center">Bottles Delivered</h3>
<div class="flex items-center justify-between w-full max-w-[240px]">
<button class="w-14 h-14 rounded-full border-2 border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-all focus:outline-none focus:border-primary">
<span class="material-symbols-outlined text-3xl" data-icon="remove">remove</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary text-center w-16">
                        5
                    </div>
<button class="w-14 h-14 rounded-full border-2 border-primary bg-primary-container text-on-primary flex items-center justify-center hover:bg-primary active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Empty Bottles Returned -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 flex flex-col items-center gap-4">
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold text-center">Empty Bottles Returned</h3>
<div class="flex items-center justify-between w-full max-w-[240px]">
<button class="w-14 h-14 rounded-full border-2 border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-all focus:outline-none focus:border-primary">
<span class="material-symbols-outlined text-3xl" data-icon="remove">remove</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface text-center w-16">
                        3
                    </div>
<button class="w-14 h-14 rounded-full border-2 border-outline-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-all focus:outline-none focus:border-primary">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
</div>
</div>
</section>
<!-- Price Section -->
<section class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Price per bottle</span>
<span class="font-body-sm text-body-sm text-on-surface font-semibold">PKR 80</span>
</div>
<div class="w-full h-px bg-outline-variant opacity-50"></div>
<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant">Total</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-1">5 BOTTLES × PKR 80</span>
</div>
<span class="font-price-display text-price-display text-primary">PKR 400</span>
</div>
</section>
<!-- Optional Notes -->
<section class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="delivery-notes">Notes (Optional)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary resize-none placeholder-outline" id="delivery-notes" placeholder="Add any specific details regarding this delivery..." rows="2"></textarea>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-4 z-40 pb-6 md:pb-4 shadow-[0_-4px_12px_rgba(0,95,115,0.08)]">
<div class="md:max-w-screen-md md:mx-auto">
<button class="w-full h-touch-target bg-primary-container text-on-primary rounded-lg font-headline-md text-headline-md flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="save">save</span>
                SAVE DELIVERY
            </button>
</div>
</div>
</body></html>
